name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --profile ci --locked --all-targets -- -D warnings
      # Node runs the page's cross-rank matching in the integration suite.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: cargo test --profile ci --locked --workspace
